<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки корпуса</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Заявки корпуса</h1>
        <div class="form">
            <h2>Добавить заявку</h2>
            <label for="input1">Что случилось?</label>
            <input type="text" id="input1" placeholder="Укажите, что случилось" >

            <label for="input2">Где?</label>
            <input type="text" id="input2" placeholder="Укажите место">

            <label for="selectCategory">Категория</label>
            <select id="selectCategory">
                <option value="">Выберите категорию</option>
                <option value="Оборудование">Оборудование</option>
                <option value="Аудитория">Аудитория</option>
                <option value="Другое">Другое</option>
            </select>

            <button id="addButton">Добавить заявку</button>

            <p id="message"></p>
        </div>

        <div class="filters">
            <h2>Список заявок</h2>
            <label for="onlyOpen">
                <input type="checkbox" id="onlyOpen">
                Только открытые
            </label>

             <label for="onlyClose">
                <input type="checkbox" id="onlyClose">
                Только закрытые
            </label>

            <label for="filterCategory">Фильтр по категории:</label>

            <select id="filterCategory">
                <option value="">Все категории</option>
                <option value="Оборудование">Оборудование</option>
                <option value="Аудитория">Аудитория</option>
                <option value="Другое">Другое</option>
            </select>
        </div>
        <div id="ticketList"></div>
    </div>

</body>
</html>
